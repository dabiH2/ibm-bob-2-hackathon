name: CRA release gate
on:
  pull_request:
  push:
    tags: ["v*"]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Article 14 Gatekeeper
        run: python -m gatekeeper check sample-app
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: release-evidence, path: sample-app/release-evidence }
